# Shared game profiles.
#
# Each entry links to a JSON file under /shared/profiles/ that the config portal
# can import. Order here does NOT matter — profiles.md sorts by `game`, so just
# append. To add one: export a profile from the portal, drop the JSON in
# shared/profiles/, and add a stanza below.
#
# Fields:
#   game  - display name (used for the alphabetical sort)
#   file  - root-relative path to the profile JSON
#   desc  - one line: what it sets, and any companion `ds5audio --map` argument
#   wake  - true if the profile turns Wake on (import those into a slot, not live)

- game: God of War Ragnarök
  file: /shared/profiles/gow-ragnarok.json
  desc: >-
    Native DualSense haptics passed straight through — Mix, DSP ch0/1,
    passthrough 100, filter raw. Pair with the bridge run as --map front.
  wake: false

- game: Ratchet & Clank
  file: /shared/profiles/ratchet-clank.json
  desc: >-
    Turns the game's pad-speaker effects into haptics off ch2/3 — Mix, DSP ch2/3,
    passthrough 0. Pair with the bridge run as --map rear.
  wake: true
