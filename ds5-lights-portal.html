<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS5 Lightbar Control</title>
<style>
  :root{
    --bg:#0a0d13; --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.14); --text:#eef2f8; --sub:#9aa4b8;
    --accent:#4ea1ff; --accent2:#7c5cff; --green:#34d17b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--text); padding:32px 20px;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(78,161,255,.22), transparent 60%),
      radial-gradient(800px 480px at 95% -10%, rgba(124,92,255,.20), transparent 60%),
      radial-gradient(700px 700px at 50% 120%, rgba(52,209,123,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  /* ---- liquid glass ---- */
  .glass{
    background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border:1px solid var(--line);
    border-radius:22px;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    padding:18px 20px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; padding:10px 14px; position:sticky; top:8px; z-index:20; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .logo{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 18px rgba(78,161,255,.45), inset 0 1px 0 rgba(255,255,255,.4); }
  .brand-title{ font-size:18px; font-weight:800; line-height:1.15; }
  .brand-sub{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .lang-switch{ display:inline-flex; gap:2px; padding:4px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); flex-shrink:0; }
  .lang-btn{ border:none; background:transparent; color:var(--sub); font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:999px; cursor:pointer; transition:all .18s ease; }
  .lang-btn:hover{ color:var(--text); }
  .lang-btn.on{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 14px rgba(78,161,255,.4); }
  h1{ font-size:20px; margin:0 0 6px; font-weight:800; }
  .status-line{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:#ff5c5c; box-shadow:0 0 10px rgba(255,92,92,.9); flex-shrink:0; }
  .dot.on{ background:var(--green); box-shadow:0 0 10px rgba(52,209,123,.95); }
  .btn{
    border:none; border-radius:12px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer;
    color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 18px rgba(78,161,255,.35); transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.07); }
  .btn.ghost{ background:rgba(255,255,255,.07); box-shadow:none; color:var(--text); }
  .sec-title{ font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--sub); margin:0 0 12px; }
  .ring-wrap{ display:flex; justify-content:center; padding:10px 0 16px; }
  .ring{ width:132px; height:132px; border-radius:50%; position:relative; transition:background .25s ease, box-shadow .25s ease; }
  .ring::after{ content:''; position:absolute; inset:14px; border-radius:50%; background:rgba(10,13,19,.85); box-shadow:inset 0 2px 10px rgba(0,0,0,.6); }
  .ring.glow{ box-shadow:0 0 34px 6px var(--ring-glow,#4ea1ff); }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .swatch{ width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,.22);
    transition:transform .15s ease, border-color .15s ease; }
  .swatch:hover{ transform:scale(1.12); }
  .swatch.on{ border-color:#fff; box-shadow:0 0 12px rgba(255,255,255,.5); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .row:last-child{ border-bottom:none; }
  .row .label{ font-size:14.5px; font-weight:600; }
  .seg{ display:inline-flex; gap:3px; padding:4px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line); }
  .seg button{ border:none; background:transparent; color:var(--sub); font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:999px; cursor:pointer; transition:all .18s ease; }
  .seg button.on{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 3px 10px rgba(78,161,255,.35); }
  input[type=color]{ width:44px; height:34px; border:none; padding:0; background:transparent; cursor:pointer; border-radius:10px; }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  input[type=color]::-webkit-color-swatch{ border-radius:8px; border:1px solid var(--line); }
  .hint{ font-size:11.5px; color:var(--sub); line-height:1.55; margin-top:10px; }
  .note{ font-size:12px; color:var(--sub); line-height:1.6; }
  .hidden{ display:none !important; }
  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="glass topbar">
    <div class="brand">
      <div class="logo">💡</div>
      <div>
        <div class="brand-title" id="brandTitle">DS5 Lightbar Control</div>
        <div class="brand-sub" id="brandSub">DS5Dongle · v1.19.0</div>
      </div>
    </div>
    <div class="lang-switch" role="group">
      <button class="lang-btn" id="langZh" onclick="langSet('zh')">中文</button>
      <button class="lang-btn" id="langEn" onclick="langSet('en')">EN</button>
    </div>
  </div>

  <div class="glass" style="margin-bottom:16px">
    <div class="status-line">
      <div class="dot" id="dot"></div>
      <span style="flex:1" id="statusText">Not connected</span>
      <button class="btn" id="connBtn" onclick="toggleConnect()">Connect</button>
    </div>
  </div>

  <div class="glass hidden fade-in" id="panel">
    <div class="sec-title" id="secTitle">Lightbar</div>
    <div class="ring-wrap"><div class="ring" id="ring"></div></div>

    <div class="sec-title" id="colorTitle">Default color</div>
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <span class="label" id="customLabel">Custom</span>
      <input type="color" id="colorPicker" value="#0042ff" onchange="onCustomColor(this.value)">
    </div>
    <div class="row">
      <span class="label" id="brightnessLabel">Brightness</span>
      <div class="seg" id="brightSeg">
        <button data-v="0" onclick="setBrightness(0)">High</button>
        <button data-v="1" onclick="setBrightness(1)">Mid</button>
        <button data-v="2" onclick="setBrightness(2)">Low</button>
      </div>
    </div>
    <div class="row">
      <span class="label" id="effectLabel">Effect</span>
      <div class="seg" id="effectSeg">
        <button data-v="static" onclick="setEffect('static')">Static</button>
        <button data-v="rainbow" onclick="setEffect('rainbow')">Rainbow</button>
        <button data-v="breath" onclick="setEffect('breath')">Breathing</button>
        <button data-v="fadein" onclick="setEffect('fadein')">Fade In</button>
        <button data-v="fadeout" onclick="setEffect('fadeout')">Fade Out</button>
      </div>
    </div>
    <div class="hint" id="hintText"></div>
  </div>
</div>

<script>
// ===== i18n =====
const UI_LANG = (() => { try { const s = localStorage.getItem('ds5lights_lang'); if (s === 'zh' || s === 'en') return s; } catch (_) {} return (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'; })();
let LANG = UI_LANG;
function t(zh, en){ return (LANG === 'zh' && zh) ? zh : en; }
const L = {
  brandTitle: ['灯带控制','DS5 Lightbar Control'],
  brandSub:  ['DS5Dongle · v1.19.0','DS5Dongle · v1.19.0'],
  connected: ['已连接','Connected'],
  notConnected: ['未连接','Not connected'],
  connect: ['连接','Connect'],
  disconnect: ['断开','Disconnect'],
  secTitle: ['灯带','Lightbar'],
  colorTitle: ['默认颜色','Default color'],
  customLabel: ['自定义','Custom'],
  brightnessLabel: ['亮度','Brightness'],
  brightHigh: ['高','High'], brightMid: ['中','Mid'], brightLow: ['低','Low'],
  effectLabel: ['效果','Effect'],
  effStatic: ['静态','Static'], effRainbow: ['彩虹','Rainbow'], effBreath: ['呼吸','Breathing'],
  effFadeIn: ['淡入','Fade In'], effFadeOut: ['淡出','Fade Out'],
  hint: ['颜色与效果通过标准 DualSense 输出报告直接发送给手柄；彩虹/呼吸为软件驱动。淡入淡出使用手柄内置动画（黑 ↔ 当前颜色）。若固件设置为“替换模式 + 灯带关闭”，灯带会保持熄灭。',
        'Color and effects are sent to the controller as standard DualSense output reports; Rainbow/Breathing are software-driven. Fade uses the controller\'s built-in animation (black ↔ current color). If the dongle is set to Replace mode with "Lightbar Off", the strip stays off.'],
  pickTitle: ['选择你的 DS5 Bridge 并连接','Click Connect and pick your DS5 Bridge'],
  needChrome: ['需要 Chrome 或 Edge（WebHID）。','Chrome or Edge required (WebHID).'],
  connErr: ['连接失败：','Connect failed: '],
};
function langSet(l){ LANG = l; try { localStorage.setItem('ds5lights_lang', l); } catch (_) {} document.documentElement.lang = (l === 'zh') ? 'zh-CN' : 'en'; applyLang(); }
function applyLang(){
  document.getElementById('brandTitle').textContent = t(L.brandTitle[0], L.brandTitle[1]);
  document.getElementById('brandSub').textContent = L.brandSub[1];
  document.title = t(L.brandTitle[0], L.brandTitle[1]);
  document.getElementById('langZh').classList.toggle('on', LANG === 'zh');
  document.getElementById('langEn').classList.toggle('on', LANG === 'en');
  document.getElementById('secTitle').textContent = t(L.secTitle[0], L.secTitle[1]);
  document.getElementById('colorTitle').textContent = t(L.colorTitle[0], L.colorTitle[1]);
  document.getElementById('customLabel').textContent = t(L.customLabel[0], L.customLabel[1]);
  document.getElementById('brightnessLabel').textContent = t(L.brightnessLabel[0], L.brightnessLabel[1]);
  document.getElementById('effectLabel').textContent = t(L.effectLabel[0], L.effectLabel[1]);
  document.getElementById('hintText').textContent = t(L.hint[0], L.hint[1]);
  const b = document.querySelectorAll('#brightSeg button');
  b[0].textContent = t(L.brightHigh[0], L.brightHigh[1]);
  b[1].textContent = t(L.brightMid[0], L.brightMid[1]);
  b[2].textContent = t(L.brightLow[0], L.brightLow[1]);
  const e = document.querySelectorAll('#effectSeg button');
  e[0].textContent = t(L.effStatic[0], L.effStatic[1]);
  e[1].textContent = t(L.effRainbow[0], L.effRainbow[1]);
  e[2].textContent = t(L.effBreath[0], L.effBreath[1]);
  e[3].textContent = t(L.effFadeIn[0], L.effFadeIn[1]);
  e[4].textContent = t(L.effFadeOut[0], L.effFadeOut[1]);
  render();
}

// ===== WebHID =====
const SONY_VID = 0x054C, DS5_PID = 0x0CE6, DSE_PID = 0x0DF2;
let device = null;
let effect = 'static', brightness = 0, cur = { r: 0, g: 66, b: 255 };
let timer = null, hue = 0, breathT = 0;

const PRESETS = [
  { name: 'PS Blue',  hex: '#0042ff' },
  { name: 'Red',      hex: '#ff3131' },
  { name: 'Green',    hex: '#1fc13c' },
  { name: 'Yellow',   hex: '#ffd500' },
  { name: 'Orange',   hex: '#ff7a00' },
  { name: 'Cyan',     hex: '#00d4ff' },
  { name: 'Purple',   hex: '#9b59f6' },
  { name: 'White',    hex: '#ffffff' },
];

function hexToRgb(hex){ const v = parseInt(hex.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function rgbToHex(r, g, b){ return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''); }
function hsvToRgb(h, s, v){
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const seg = Math.floor(h / 60) % 6;
  let r = 0, g = 0, b = 0;
  if (seg === 0) { r = c; g = x; } else if (seg === 1) { r = x; g = c; }
  else if (seg === 2) { g = c; b = x; } else if (seg === 3) { g = x; b = c; }
  else if (seg === 4) { r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

// Standard DualSense output report (47-byte payload), forwarded by the dongle.
async function sendLight(r, g, b, fade, bri){
  if (!device || !device.opened) return;
  const p = new Uint8Array(47);
  p[1]  = 0xF7 | 0x04;  // validFlag1 default + AllowLedColor (bit 2)
  p[38] = 0x03;         // AllowLightBrightnessChange | AllowColorLightFadeAnimation
  p[41] = fade & 0xFF;  // LightFadeAnimation: 0 none, 1 fade in, 2 fade out
  p[42] = bri & 0xFF;   // LightBrightness: 0 bright, 1 mid, 2 dim
  p[44] = r & 0xFF; p[45] = g & 0xFF; p[46] = b & 0xFF;
  await device.sendReport(0x02, p);
}

function stopTimer(){ if (timer !== null) { clearInterval(timer); timer = null; } }
function setColor(r, g, b){
  cur = { r, g, b };
  document.getElementById('colorPicker').value = rgbToHex(r, g, b);
  updateRing();
  if (effect === 'static' || effect === 'fadein' || effect === 'fadeout') sendLight(r, g, b, effect === 'fadein' ? 1 : (effect === 'fadeout' ? 2 : 0), brightness);
}
function setBrightness(v){
  brightness = v;
  document.querySelectorAll('#brightSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  if (effect === 'static' || effect === 'fadein' || effect === 'fadeout') sendLight(cur.r, cur.g, cur.b, effect === 'fadein' ? 1 : (effect === 'fadeout' ? 2 : 0), brightness);
}
function setEffect(e){
  effect = e;
  stopTimer();
  document.querySelectorAll('#effectSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === e));
  if (e === 'rainbow') {
    hue = 0; timer = setInterval(rainbowTick, 33);
  } else if (e === 'breath') {
    breathT = 0; timer = setInterval(breathTick, 30);
  } else {
    sendLight(cur.r, cur.g, cur.b, e === 'fadein' ? 1 : (e === 'fadeout' ? 2 : 0), brightness);
  }
}
function rainbowTick(){
  const [r, g, b] = hsvToRgb(hue, 1, 1);
  hue = (hue + 2) % 360;
  cur = { r, g, b };
  updateRing();
  sendLight(r, g, b, 0, brightness).catch(() => setEffect('static'));
}
function breathTick(){
  breathT += 0.09;
  const k = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(breathT));
  const r = Math.round(cur.r * k), g = Math.round(cur.g * k), b = Math.round(cur.b * k);
  updateRing(r, g, b);
  sendLight(r, g, b, 0, brightness).catch(() => setEffect('static'));
}
function onCustomColor(hex){
  const [r, g, b] = hexToRgb(hex);
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.hex === hex.toLowerCase()));
  setColor(r, g, b);
}
function updateRing(r, g, b){
  const rr = r === undefined ? cur.r : r, gg = g === undefined ? cur.g : g, bb = b === undefined ? cur.b : b;
  const ring = document.getElementById('ring');
  const col = `rgb(${rr},${gg},${bb})`;
  ring.style.background = `radial-gradient(circle at 35% 30%, ${col}, rgba(0,0,0,.35))`;
  ring.style.setProperty('--ring-glow', `rgba(${rr},${gg},${bb},.55)`);
  ring.classList.add('glow');
}

function render(){
  const on = device && device.opened;
  document.getElementById('dot').classList.toggle('on', !!on);
  document.getElementById('statusText').textContent = on ? t(L.connected[0], L.connected[1]) : t(L.notConnected[0], L.notConnected[1]);
  document.getElementById('connBtn').textContent = on ? t(L.disconnect[0], L.disconnect[1]) : t(L.connect[0], L.connect[1]);
  document.getElementById('panel').classList.toggle('hidden', !on);
  if (on) { updateRing(); }
}

function buildSwatches(){
  const box = document.getElementById('swatches');
  box.innerHTML = '';
  PRESETS.forEach(p => {
    const el = document.createElement('button');
    el.className = 'swatch' + (p.hex === '#0042ff' ? ' on' : '');
    el.style.background = p.hex;
    el.dataset.hex = p.hex;
    el.title = p.name;
    el.onclick = () => onCustomColor(p.hex);
    box.appendChild(el);
  });
}

async function toggleConnect(){
  if (device && device.opened) { stopTimer(); await device.close(); device = null; render(); return; }
  try {
    const devices = await navigator.hid.requestDevice({ filters: [{ vendorId: SONY_VID, productId: DS5_PID }, { vendorId: SONY_VID, productId: DSE_PID }] });
    if (!devices.length) return;
    device = devices[0];
    if (!device.opened) await device.open();
    if (navigator.hid && navigator.hid.addEventListener) {
      navigator.hid.addEventListener('disconnect', e => { if (device && e.device === device) { stopTimer(); device = null; render(); } });
    }
    render();
    setEffect('static');
    setColor(cur.r, cur.g, cur.b);
  } catch (e) { alert(t(L.connErr[0], L.connErr[1]) + e.message); }
}

document.getElementById('langZh').classList.toggle('on', UI_LANG === 'zh');
document.getElementById('langEn').classList.toggle('on', UI_LANG === 'en');
buildSwatches();
document.querySelectorAll('#brightSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === 0));
document.querySelectorAll('#effectSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === 'static'));
langSet(UI_LANG);
</script>
</body>
</html>
