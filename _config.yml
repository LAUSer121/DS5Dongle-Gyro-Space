# GitHub Pages configuration.
#
# Renders README.md as the site homepage (https://artzox.github.io/DS5Dongle/)
# using a built-in theme, and serves ds5-config-portal.html directly as the
# in-browser config tool at /ds5-config-portal.html. No index.html is used, so
# there is no second copy of the portal to keep in sync.
#
# The title and description below also become the page <title> and meta
# description, which is what search engines index.
theme: jekyll-theme-midnight
title: DS5Dongle — Audio Auto-Haptics Edition
description: >-
  Wireless DualSense-to-PC bridge on a Raspberry Pi Pico 2 W: audio-derived
  haptics for games that have none, adaptive triggers, gyro aiming, right-stick
  inversion, and a browser-based configuration portal.
