<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS5 Bridge Config (POC)</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2f3a; --text:#e6e8ec; --sub:#9aa0aa; --accent:#4ea1ff; --green:#3fb950; --red:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .subtitle { color:var(--sub); font-size:13px; margin:0 0 20px; }
  .status-bar { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:16px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--red); flex-shrink:0; }
  .dot.on { background:var(--green); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .subdiv { margin:16px 0 8px; padding-top:12px; border-top:2px solid var(--sub,#888);
            font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
            color:var(--fg,#eee); }
  .tpair { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 22px; align-items:start; }
  .tcolhead { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub);
              padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid var(--line,#333); }
  .tcell { min-width:0; }
  .subdiv-light { margin:12px 0 2px; padding-top:8px; border-top:1px solid var(--line,#333);
                  font-size:11px; color:var(--sub); }
  .tshared { margin-top:12px; padding-top:8px; border-top:1px solid var(--line,#333); }
  .tabbar { display:flex; gap:4px; flex-wrap:wrap; margin:10px 0 14px; }
  .tab { appearance:none; border:1px solid var(--line,#333); background:transparent; color:var(--sub);
         padding:7px 15px; border-radius:8px; font:500 13px system-ui; cursor:pointer; }
  .tab:hover { color:var(--fg,#eee); border-color:var(--sub); }
  .tab.active { background:var(--accent,#3a6df0); border-color:var(--accent,#3a6df0); color:#fff; }
  .card-title { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin-bottom:12px; }
  /* Find a setting. Sits under the tab bar so the tabs stay the primary
     navigation and search is the fallback for "I know what it does, not where
     it lives". */
  .searchwrap { display:flex; align-items:center; gap:8px; margin:-4px 0 14px; }
  .searchwrap input[type=search] { flex:1; min-width:0; width:auto; text-align:left;
        background:#11141a; border:1px solid var(--border); color:var(--text);
        border-radius:8px; padding:9px 12px; font-size:14px; }
  .searchwrap input[type=search]:focus { outline:none; border-color:var(--accent); }
  .searchwrap input[type=search]::placeholder { color:var(--sub); }
  .searchwrap .hits { font-size:12px; color:var(--sub); white-space:nowrap; }
  .card-title .intab { text-transform:none; letter-spacing:0; color:var(--accent); font-weight:600; }
  .nohits { color:var(--sub); font-size:14px; line-height:1.6; margin:0; }
  .nohits b { color:var(--text); font-weight:600; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:none; }
  .row .label { font-size:15px; }
  .row .hint { font-size:12px; color:var(--sub); margin-top:2px; }
  /* Hover glossary for each setting. The marker sits after the label; the popover
     is a CSS ::after so there is no per-field JS and nothing to wire into events.
     No ancestor sets overflow:hidden, so the popover is never clipped. */
  .desc { position:relative; display:inline-flex; align-items:center; justify-content:center;
          width:15px; height:15px; margin-left:7px; border-radius:50%;
          border:1px solid var(--sub); color:var(--sub);
          font-size:10px; font-weight:700; font-style:normal; line-height:1;
          cursor:help; vertical-align:middle; user-select:none; }
  .desc:hover { border-color:var(--accent); color:var(--accent); }
  .desc::after { content:attr(data-tip); position:absolute; left:50%; top:calc(100% + 9px);
          transform:translateX(-50%); width:max-content; min-width:180px; max-width:300px;
          background:var(--card); color:var(--text); border:1px solid var(--border);
          border-radius:8px; padding:9px 11px; font-size:12.5px; font-weight:400; line-height:1.45;
          text-align:left; white-space:normal; box-shadow:0 6px 22px rgba(0,0,0,.5);
          opacity:0; visibility:hidden; transition:opacity .12s; pointer-events:none; z-index:60; }
  .desc::before { content:''; position:absolute; left:50%; top:calc(100% + 3px);
          transform:translateX(-50%); border:6px solid transparent; border-bottom-color:var(--border);
          opacity:0; visibility:hidden; transition:opacity .12s; z-index:61; }
  .desc:hover::after, .desc:hover::before { opacity:1; visibility:visible; }
  input[type=number], select { background:#11141a; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:14px; width:150px; text-align:right; }
  select { text-align:left; }
  .btn { border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  .actions { display:flex; gap:10px; margin-top:8px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:8px; transition:transform .3s; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.err { border-color:var(--red); }
  .info-text { color:var(--sub); font-size:14px; line-height:1.5; }
  /* ===== Modern theme (i18n UI refresh) ===== */

  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo { width:40px; height:40px; border-radius:12px; display:flex; align-items:center;

  .brand-title { font-size:20px; font-weight:800; letter-spacing:.2px; line-height:1.1; }
  .brand-sub { font-size:12px; color:var(--sub); margin-top:3px; }
  .lang-switch { display:inline-flex; gap:2px; padding:4px; border-radius:999px;

  .lang-btn { border:none; background:transparent; color:var(--sub); font-size:13px; font-weight:700;
    padding:7px 16px; border-radius:999px; cursor:pointer; transition:all .18s ease; }
  .lang-btn:hover { color:var(--text); }
  .lang-btn.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    box-shadow:0 4px 14px rgba(78,161,255,.4); }
  .status-bar { border-radius:var(--radius); background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--border); box-shadow:var(--shadow); }
  .card { border-radius:var(--radius); background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--border); box-shadow:0 6px 24px rgba(0,0,0,.22); transition:border-color .15s ease; }
  .card:hover { border-color:#2e3a4e; }
  .card-title { font-size:11px; font-weight:800; letter-spacing:1px; color:var(--sub); }
  .tabbar { gap:6px; }
  .tab { border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--sub);
    padding:8px 16px; font:600 13px system-ui; transition:all .15s ease; }
  .tab:hover { color:var(--text); border-color:#3a4558; }
  .tab.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent;
    color:#fff; box-shadow:0 4px 16px rgba(78,161,255,.35); }
  .btn { border-radius:10px; transition:all .15s ease; }
  .btn-primary { background-image:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 4px 14px rgba(78,161,255,.3); }
  .btn-green { background-image:linear-gradient(135deg,#34d17b,#1fa35f);
    box-shadow:0 4px 14px rgba(52,209,123,.28); }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.06); }
  .btn:active { transform:translateY(0); }
  .btn-outline { background:rgba(255,255,255,.02); }
  input[type=number], select { background:#0f141c; border-radius:10px;
    transition:border-color .15s, box-shadow .15s; }
  input[type=number]:focus, select:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(78,161,255,.18); }
  .row { padding:11px 0; }
  .row .label { font-size:15px; font-weight:600; }
  .dot { box-shadow:0 0 10px rgba(255,92,92,.8); }
  .dot.on { box-shadow:0 0 10px rgba(52,209,123,.9); }
  .actions { flex-wrap:wrap; }
  .swatch { width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(255,255,255,.25); transition:transform .15s ease, border-color .15s ease; }
  .swatch:hover { transform:scale(1.12); }
  .swatch.on { border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,.5); }
  .seg { display:inline-flex; gap:3px; padding:4px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid var(--border); flex-wrap:wrap; }
  .seg button { border:none; background:transparent; color:var(--sub); font-size:12.5px; font-weight:700;
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .15s ease; }
  .seg button:hover { color:var(--text); }
  .seg button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  input[type=color] { width:44px; height:34px; border:none; padding:0; background:transparent; cursor:pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding:2px; }
  input[type=color]::-webkit-color-swatch { border-radius:8px; border:1px solid var(--border); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2b3547; border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  @media (max-width:560px){
    .topbar { flex-wrap:wrap; }
    .lang-switch { order:3; width:100%; }
    .lang-btn { flex:1; text-align:center; }
  }
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const SONY_VID = 0x054C, DS5_PID = 0x0CE6, DSE_PID = 0x0DF2;
// The dongle can expose EXTRA HID interfaces with the same VID/PID: enabling
// Wake (or the PS shortcut) adds a boot-keyboard interface for the wake key.
// WebHID lists every interface as its own HIDDevice, and feature reports only
// work on the GAMEPAD interface (top-level collection Generic Desktop/Game Pad
// or the vendor-defined pages) - sending to the keyboard interface fails, which
// broke profile auto-apply whenever Wake was on. Always select by collection,
// never by VID/PID alone.
function isWakeKeyboardIface(d){
  // The wake feature adds a boot-keyboard HID interface with the same VID/PID.
  // Only treat a device as that keyboard when it is UNAMBIGUOUSLY one (every
  // top-level collection is Generic Desktop / Keyboard). Anything uncertain is
  // kept - selection must never be stricter than the plain VID/PID matching
  // that has always worked.
  const cols = (d && d.collections) || [];
  return cols.length > 0 && cols.every(c => c.usagePage === 0x01 && c.usage === 0x06);
}
// Is this HIDDevice the dongle's GAMEPAD interface? The Windows battery
// (UPS) feature adds another HID collection under the same Sony VID/PID, and
// the gyro mouse is a THIRD HID collection sharing that VID/PID - from v1.23.0
// a plain VID/PID match can land on the mouse instead of the gamepad, and
// every feature-report read then fails ("FW: pre-1.0.5"). Feature reports only
// work on the gamepad interface, so prefer a POSITIVE match on the gamepad
// usage and keep exclusion as the fallback for anything unrecognised.
function isGamepadIface(d){
  const cols = (d && d.collections) || [];
  // Generic Desktop / Joystick(0x04) or Game Pad(0x05)
  return cols.some(c => c.usagePage === 0x01 && (c.usage === 0x04 || c.usage === 0x05));
}
function isMouseIface(d){
  const cols = (d && d.collections) || [];
  return cols.length > 0 && cols.every(c => c.usagePage === 0x01 && c.usage === 0x02);
}
function pickDs5(list){
  const m = (list || []).filter(x => x && x.vendorId === SONY_VID
                                  && (x.productId === DS5_PID || x.productId === DSE_PID));
  return m.find(isGamepadIface)                                            // the real thing
      || m.find(x => !isWakeKeyboardIface(x) && !isMouseIface(x))          // known extras out
      || m[0] || null;                                                     // never stricter
                                                                           // than VID/PID
}


// Unthrottled sleep. Chromium throttles main-thread timers on hidden/minimized
// pages to >=1 per second, which would turn the many short waits between HID
// reads into minutes when the automation opens this page minimized. Web Workers
// are exempt from that throttling, so delays keep full speed even when hidden.
const _sleepWorker = (() => {
  try {
    const src = 'onmessage=(e)=>{setTimeout(()=>postMessage(e.data),e.data.ms)}';
    return new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
  } catch (_) { return null; } // fallback below keeps old behavior
})();
let _sleepSeq = 0;
const _sleepWaiters = new Map();
if (_sleepWorker) _sleepWorker.onmessage = (e) => {
  const w = _sleepWaiters.get(e.data.id);
  if (w) { _sleepWaiters.delete(e.data.id); w(); }
};
function sleep(ms){
  if (!_sleepWorker) return new Promise(r => setTimeout(r, ms));
  return new Promise(r => { const id = ++_sleepSeq; _sleepWaiters.set(id, r); _sleepWorker.postMessage({id, ms}); });
}

const SET_REPORT = 0x80, GET_REPORT = 0x81;
// Slot-command replies (activate 0x09, slot field-read 0x0d) come back on report
// 0x84, split off from 0x81 so this portal's own 1-second diagnostic poll on
// 0x81 can't clobber a slot-activate page's reply in another process, nor a
// backup read here. Reads for slot replies use SLOT_REPORT (0x84).
const SLOT_REPORT = 0x84; // full 63-byte feature report (0x82 is only 9 bytes in the descriptor!)

// Field definitions: [field_id, key, type('u8'|'u16'|'f32'), label, kind, opts]
// Fields grouped into sections. Each field: [id, key, type, label, kind, opts]
// kind: 'number' | 'select' | 'bool' | 'bits' ; type: 'u8' | 'u16' | 'f32'
// ('bits' = one checkbox per bit of a bitmask byte; opts is the array of bit labels)
// ===== i18n: 中 / EN (auto-follows the browser/system language) =====
// Defaults to Chinese when the browser language starts with "zh", English
// otherwise. A manual toggle (top-right select) overrides it and is remembered
// in localStorage. English is the source language; FIELD_ZH only carries the
// Chinese overlay for labels and select/bits option text.
const UI_LANG = (() => {
  try { const s = localStorage.getItem('ds5portal_lang'); if (s === 'zh' || s === 'en') return s; } catch (_) {}
  return (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
})();
let LANG = UI_LANG;
function t(zh, en){ return (LANG === 'zh' && zh) ? zh : en; }
function langSet(l){
  LANG = l;
  try { localStorage.setItem('ds5portal_lang', l); } catch (_) {}
  document.documentElement.lang = (l === 'zh') ? 'zh-CN' : 'en';
  document.title = t('DS5 Bridge 配置', 'DS5 Bridge Config');
  render();
}
const SECTION_ZH = {
  'Auto-Haptics & Speaker Effect Leak': '自动触觉 & 扬声器效果泄漏',
  'General Haptics & Audio': '常规触觉与音频',
  'Native Haptics Filter': '原生触觉滤波',
  'Rumble → Trigger': '震动 → 扳机',
  'Adaptive Triggers — R2 (right trigger)': '自适应扳机 — R2（右扳机）',
  'Adaptive Triggers — L2 (left trigger)': '自适应扳机 — L2（左扳机）',
  'Gyro Aiming': '陀螺仪瞄准',
  'Right Stick': '右摇杆',
  'Device & Connection': '设备与连接',
  'Advanced — BT Latency (experimental)': '高级 — 蓝牙延迟（实验性）',
  'Macros': '宏',
};
const SUB_DIV_ZH = {
  'Speaker Effect Leak': '扬声器效果泄漏',
  'Custom captured effect': '自定义捕获效果',
};
const FIELD_ZH = {
  auto_haptics_enable: { label:'模式', opts:{0:'关闭',1:'与原声混合',2:'替换（仅音频）'} },
  auto_haptics_gain: { label:'强度（%）' },
  auto_haptics_smooth: { label:'平滑度' },
  auto_haptics_gate: { label:'噪声门' },
  mix_native_level: { label:'混合中原生直通（%）— 0 用于非原生游戏' },
  mix_native_filter: { label:'过滤混合中的原生直通', opts:{1:'过滤（默认）— 阻止 4 声道镜像泄漏',0:'原始 — 保留原生触觉'} },
  ah_dsp_source: { label:'自动触觉 DSP 音源', opts:{0:'ch0/1（默认）— 与扬声器+泄漏同源',1:'ch2/3 — 仅脚本音源（运行 ds5audio --map rear）'} },
  auto_haptics_lowpass_hz: { label:'低通截止（Hz）' },
  ah_xover_hz: { label:'分频点（Hz，0=关闭；30-200，必须低于低通截止）' },
  ah_low_gain: { label:'低频段增益（分频点以下 — 冲击）' },
  ah_high_gain: { label:'高频段增益（分频点..截止 — 音乐/人声范围）' },
  auto_haptics_slope: { label:'滤波斜率', opts:{6:'6 dB/oct（平缓）',12:'12 dB/oct（默认）',24:'24 dB/oct（陡峭）'} },
  auto_mute_replace: { label:'自动静音扬声器（替换模式）' },
  auto_mute_mix: { label:'自动静音扬声器（混合模式）' },
  lightbar_off: { label:'替换模式下关闭灯条' },
  rumble_haptic_strength: { label:'转换震动强度（混合）— 超过 100 会过载' },
  effect_leak_volume: { label:'效果泄漏音量（0=关闭）' },
  effect_leak_sensitivity: { label:'效果泄漏灵敏度' },
  effect_leak_decay: { label:'效果泄漏衰减/淡出' },
  effect_leak_attack: { label:'效果泄漏触发/响应' },
  effect_leak_output_hp_hz: { label:'效果泄漏输出高通（Hz）' },
  effect_leak_hp_hz: { label:'效果泄漏检测频段（Hz）' },
  effect_leak_lp_hz: { label:'效果泄漏输出低通（Hz）— 泄漏窗口上限' },
  effect_leak_max_burst: { label:'最大突发（x5 ms，0=不限）— 持续音只保留一个短促重音' },
  effect_leak_hold: { label:'效果泄漏门保持（x5 ms）— 防止抖动/斩波' },
  haptics_gain: { label:'原生触觉增益' },
  speaker_volume: { label:'扬声器音量' },
  headset_volume: { label:'耳机音量' },
  speaker_gain: { label:'扬声器增益' },
  sync_spk_headset_volume: { label:'同步扬声器与耳机音量' },
  lock_volume: { label:'锁定音量' },
  disable_mic: { label:'禁用麦克风' },
  disable_speaker: { label:'禁用扬声器' },
  macro_disable: { label:'宏' },
  controller_mode: { label:'控制器类型', opts:{0:'DualSense（DS5）',1:'DualSense Edge（DSE）',2:'自动检测'} },
  polling_rate_mode: { label:'轮询率', opts:{0:'250 Hz',1:'500 Hz',2:'实时'} },
  audio_buffer_length: { label:'音频缓冲长度' },
  inactive_time: { label:'空闲时间（分钟）' },
  disable_inactive_disconnect: { label:'禁用空闲自动断开' },
  disable_pico_led: { label:'禁用 Pico LED' },
  enable_wake: { label:'按 PS 键唤醒电脑' },
  haptics_aa: { label:'平滑（抗混叠滤波）', opts:{1:'关闭 — 原始质感（1.0.4 前）',2:'轻度 — 去毛刺保留干脆（推荐）',3:'强力 — 最大平滑（可能感觉沉闷）'} },
  r2t_mode: { label:'模式', opts:{0:'关闭',1:'仅左扳机',2:'仅右扳机',3:'两个扳机'} },
  r2t_on_press: { label:'仅在按下扳机时振动' },

// Escape text for safe embedding inside a double-quoted HTML attribute. PORTAL
// HARD RULE #1: unescaped quotes close the attribute and silently break markup.
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                  .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// The marker HTML for a field key, or '' if the field has no description.
function descMarker(key){
  const d = DESCRIPTIONS[key];
  return d ? `<span class="desc" data-tip="${escAttr(d)}" aria-label="${escAttr(d)}">i</span>` : '';
}

let device = null;
let saving = false; // suspends background diagnostic polling during save/reconnect

// When the controller is turned off (disconnected), WebHID fires a disconnect
// event. Without handling it, our cached `device` keeps reporting opened===true
// even though its connection is dead, so the next save writes to a stale handle
// and fails (requiring a manual reconnect). Null the handle on disconnect so the
// next save's ensureDevice() cleanly re-acquires the freshly-reconnected device.
if (navigator.hid && navigator.hid.addEventListener) {
  navigator.hid.addEventListener('disconnect', (e) => {
    if (device && e.device === device) {
      device = null;
      if (typeof render === 'function') { try { render(); } catch(_){} }
    }
  });

  // When the device returns (controller reconnects, or the USB device re-enumerates
  // after the PC wakes from sleep), WebHID fires a connect event. Re-acquire the
  // fresh handle and re-read, so the portal recovers automatically instead of
  // sitting with a stale/null handle and showing 0 values. This specifically fixes
  // the "all values 0 after PC wake" case: sleep/resume re-enumerates the device,
  // and without this the portal never re-grabs it.
  navigator.hid.addEventListener('connect', async (e) => {
    try {
      const d = e.device;
      if (!d || d.vendorId !== SONY_VID) return;
      if (d.productId !== DS5_PID && d.productId !== DSE_PID) return;
      if (isWakeKeyboardIface(d)) return;
      // Only auto-recover if we don't already hold a live handle.
      if (device && device.opened) return;
      device = d;
      if (!device.opened) await device.open();
      // Give the firmware a moment to (re)populate its feature data after connect,
      // then re-read so the UI reflects real values rather than 0s.
      await sleep(400);
      if (typeof reloadFromDevice === 'function') { await reloadFromDevice(); }
      if (typeof render === 'function') { render(); }
    } catch (_) { /* leave handle; user can click Connect */ }
  });
}
let fwVer = null;
let savedSnapshot = {}; // last-saved config, to detect which fields changed on save
let config = {};

function toast(msg, err=false){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2200); }

// Read the full config + firmware version + loaded profile from the device, with
// the 1-second background poll suspended for the whole sequence. The poll's reads
// (loaded-profile 0x67, battery, auto-haptics) share the 0x81 GET buffer with the
// per-field config reads here, so if it fires mid-read it clobbers a reply — which
// caused slow connects and, on the silent auto-reconnect handler, a stale version
// with default-looking settings. `saving` is the existing poll gate; wasSaving keeps
// this safe to nest (e.g. when a save/activate path already holds it).
async function reloadFromDevice(){
  const wasSaving = saving;
  saving = true;
  try {
    await readAll();
    savedSnapshot = {...config};   // baseline for change detection on save
    fwVer = null;
    try {
      const maj = await readField(0x7d,'u8'), min = await readField(0x7e,'u8'),
            pat = await readField(0x7f,'u8'), cfgv = await readField(0x00,'u16');
      if (maj !== null && maj !== undefined) fwVer = {maj,min,pat,cfgv};
    } catch(e){ /* pre-1.0.5 firmware: no version fields */ }
    await readLoadedProfile();
  } finally {
    saving = wasSaving;
  }
}
async function connect(){
  try{
    const filters=[{vendorId:SONY_VID,productId:DS5_PID},{vendorId:SONY_VID,productId:DSE_PID}];
    const devices=await navigator.hid.requestDevice({filters});
    if(!devices.length){
      toast(t('没有找到设备 — 请确认适配器已插入、手柄已开启，然后刷新页面重试。','No device found — make sure the dongle is plugged in and the controller is on, then refresh and retry.'), true);
      return;
    }
    // NEVER fall back to devices[0]: with the UPS battery / wake-keyboard
    // interfaces present, WebHID returns several HIDDevices with the same Sony
    // VID/PID, and the wrong one cannot serve the portal's feature reports.
    // pickDs5 identifies the GAMEPAD interface by its Generic Desktop/Game Pad
    // collection; anything else is an error, not a guess.
    device=pickDs5(devices);
    if(!device){
      toast(t('找到了 HID 设备但无法识别 DS5 手柄接口 — 请确认这是 DS5 适配器','Found HID devices but could not identify the DS5 gamepad interface — make sure this is the DS5 dongle'), true);
      return;
    }
    if(!device.opened) await device.open();
    if (device.addEventListener) device.addEventListener('inputreport', onInputReport);
    await reloadFromDevice();   // full read with the 1s poll suspended (see helper)
    render();
    refreshStatus();
  }catch(e){ toast('Connect failed: '+e.message,true); }
}

// Fallback for when the picker shows nothing: show EVERY HID device so the
// dongle can be selected manually (e.g. if it is in its standby identity or a
// browser HID permission hiccup hid it from the filtered chooser).
async function connectAll(){
  try{
    // Chrome's WebHID marks `filters` as a REQUIRED member of the options
    // dictionary, so requestDevice() and requestDevice({}) both throw. An empty
    // filters array is the documented way to show every HID device.
    const devices=await navigator.hid.requestDevice({filters: []});
    if(!devices.length) return;
    device=pickDs5(devices);
    if(!device){
      toast(t('找到了 HID 设备但无法识别 DS5 手柄接口 — 请确认这是 DS5 适配器','Found HID devices but could not identify the DS5 gamepad interface — make sure this is the DS5 dongle'), true);
      return;
    }
    if(!device.opened) await device.open();
    if (device.addEventListener) device.addEventListener('inputreport', onInputReport);
    await reloadFromDevice();
    render();
    refreshStatus();
  }catch(e){ toast('Connect failed: '+e.message,true); }
}

async function disconnect(){ lightsStop(); if(device&&device.opened) await device.close(); device=null; lastInput=null; inputRate=0; render(); }

// Send a 0x80 command: [0x66, cmd_id, ...args], padded to the full 63-byte
// feature report size (WebHID requires the exact declared report length).
async function sendCmd(cmdId, args=[]){
  const payload = new Uint8Array(63);
  payload[0] = 0x66;
  payload[1] = cmdId;
  args.forEach((b,i) => { payload[2+i] = b; });
  await device.sendFeatureReport(SET_REPORT, payload);
}

// --- HID transaction lock -------------------------------------------------
// Every command/reply pair shares the single 0x81 feature-report buffer, so
// two concurrent transactions (slot refresh vs. diagnostics poll vs. a second
// refresh triggered by render) can overwrite each other's replies - the loser
// reads null and a filled slot renders as "empty". Serialize them.
let _hidLock = Promise.resolve();
function hidLocked(fn){
  const run = _hidLock.then(fn, fn);
  _hidLock = run.catch(()=>{});
  return run;
}

// --- Profile slots (fw >= 1.1.2): cmd 0x08 save, 0x09 activate, 0x0a info ---
async function readCmdReplyOn(reportId, cmdId, expectIdx, tries=30){
  // Robust against three real-world hazards: (1) STALE replies - the reply
  // buffer holds the LAST reply, so we require both the command id AND the
  // echoed slot index to match, and treat firmware's PENDING marker (status
  // 0xFE) as "keep waiting"; (2) USB stalls - slot save/activate performs a
  // flash sector erase with interrupts off, so reads can throw briefly;
  // (3) slow flash - the window is ~1.8s, not a few hundred ms.
  // reportId selects the buffer: 0x81 for portal commands, 0x82 for slot
  // commands (activate / slot field-read) which are split off so this portal's
  // own 0x81 diagnostic poll can't clobber them.
  for (let t = 0; t < tries; t++){
    await sleep(60);
    let raw = null;
    try {
      const data = await device.receiveFeatureReport(reportId);
      raw = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
    } catch(_) { continue; } // mid-flash stall; retry
    for (let k = 0; k < Math.min(4, raw.length); k++){
      if (raw[k] === 0x66 && raw[k+1] === cmdId){
        const r = raw.slice(k);
        if (r[2] === 0xFE) break;                              // pending: keep polling
        if (expectIdx !== undefined && r[3] !== expectIdx) break; // stale other-slot reply
        return r;
      }
    }
  }
  return null;
}
// Backward-compatible wrapper: portal commands reply on 0x81.
async function readCmdReply(cmdId, expectIdx, tries=30){
  // True slot commands (save 0x08, activate 0x09, info 0x0a, slot-field-read
  // 0x0d) reply on SLOT_REPORT so neither this portal's 1-second 0x81
  // diagnostic poll nor bulk config ops can consume their replies. Bulk config
  // get/set (0x0b/0x0c) are PORTAL commands and stay on 0x81.
  const rid = (cmdId === 0x08 || cmdId === 0x09 || cmdId === 0x0a || cmdId === 0x0d) ? SLOT_REPORT : GET_REPORT;
  return readCmdReplyOn(rid, cmdId, expectIdx, tries);
}
async function slotInfo(idx){
  await sendCmd(0x0a, [idx]);
  const r = await readCmdReply(0x0a, idx, 10);
  if (!r || r[2] !== 0x00) return null; // old firmware or bad slot index
  const name = new TextDecoder().decode(r.slice(6, 22)).replace(/\0+$/,'').trim();
  return { valid: r[4] === 1, cfgVersion: r[5], name };
}

// Currently-loaded profile (fw 1.18.22+): the dongle tracks which slot is live
// in RAM, set whenever a slot is activated by the portal OR the automation, so
// this reflects background profile switches once the portal re-reads (on connect
// and on the 1 s poll). Reply: 0x66 0x67 status slot(0xFF=none) edited name[16].
async function readLoadedProfile(){
  try {
    await sendCmd(0x67, []);
    const r = await readCmdReplyOn(GET_REPORT, 0x67, undefined, 8);
    if (!r || r[2] !== 0x00) return; // pre-1.18.22 firmware: leave the bar as-is
    const slot = r[3];
    const edited = r[4] === 1;
    let name = '';
    if (slot !== 0xFF) name = new TextDecoder().decode(r.slice(5, 21)).replace(/\0+$/,'').trim();
    window._loadedProfile = { slot, edited, name };
    const el = document.getElementById('profilebar');
    if (el) el.innerHTML = profileBarInner();
  } catch(_){ /* mid-flash stall etc.; next poll retries */ }
}
function profileBarInner(){
  const p = window._loadedProfile;
  if (!p || p.slot === 0xFF || p.slot == null)
    return `<span style="color:var(--sub)">${t('已加载配置：','Loaded profile:')}</span> <span style="color:var(--sub)">${t('—&nbsp; 非来自已保存槽位','—&nbsp; not from a saved slot')}</span>`;
  const name = (p.name && p.name.length) ? escAttr(p.name) : `slot ${p.slot + 1}`;
  return `<span style="color:var(--sub)">${t('已加载配置：','Loaded profile:')}</span> <b>${name}</b>`
       + (p.edited ? ` <span style="color:#e0a030">${t('（已编辑）','(edited)')}</span>` : '');
}
function profileBarHTML(){
  // Rendered right under the connect status bar so it is visible on every tab,
  // not buried in the Device-tab diagnostics. The 1 s poll updates it in place.
  return `<div class="status-bar" id="profilebar" style="margin-top:-10px;padding:9px 14px;font-size:13px">${profileBarInner()}</div>`;
}
async function slotSave(idx, name){
  const bytes = Array.from(new TextEncoder().encode((name||'').slice(0,16)));
  await sendCmd(0x08, [idx, ...bytes]);
  const r = await readCmdReply(0x08, idx);
  return !!(r && r[2] === 0x00);
}
async function slotActivate(idx){
  // One silent retry: activation right after another activation/save can land
  // while the previous flash write is still settling.
  for (let attempt = 0; attempt < 2; attempt++){
    await sendCmd(0x09, [idx]);
    const r = await readCmdReply(0x09, idx);
    if (r && (r[2] === 0x00 || r[2] === 0x02)) return { needsReenum: r[4] === 1 }; // 0x02 = activated, persist deferred
    await sleep(800);
  }
  return null;
}
// Must match the firmware's SLOT_COUNT. A mismatch degrades gracefully both ways:
// an older dongle simply reports the extra indices as empty, and an older portal
// just shows fewer slots than exist.
const UI_SLOT_COUNT = 32;
let slotsBusy = false, slotsRerun = false;
let _slotHealTries = 0;
async function _refreshSlotsOnce(){
  const box = document.getElementById('slotbox');
  if (!box) return;
  if (!device || !device.opened){
    box.innerHTML = t('连接后可管理槽位。','Connect to manage slots.');
    // Self-heal: after a save/activate reconnect cycle this runs before the
    // new handle exists; retry shortly instead of staying stuck until a
    // manual page refresh.
    if (_slotHealTries++ < 8) setTimeout(() => refreshSlots(), 1500);
    return;
  }
  let rows = '';
  for (let i = 0; i < UI_SLOT_COUNT; i++){ // older fw reports out-of-range indices as empty
    let info = await hidLocked(() => slotInfo(i));
    if (info === null){
      // Freshly re-enumerated devices can miss the first queries; retry
      // before drawing conclusions (slot 0 null used to mean "old firmware",
      // which a transient hiccup turned into a stuck message).
      for (let a = 0; a < (i === 0 ? 3 : 1) && info === null; a++){
        await sleep(700);
        info = await hidLocked(() => slotInfo(i));
      }
    }
    if (info === null && i === 0){
      box.innerHTML = 'Profile slots need firmware 1.1.2+.';
      if (_slotHealTries++ < 8) setTimeout(() => refreshSlots(), 1500);
      return;
    }
    const label = info && info.valid ? `<b>${info.name || '(unnamed)'}</b>` : '<span style="color:var(--sub)">empty</span>';
    rows += `<div style="display:flex;gap:8px;align-items:center;margin:4px 0">
      <span style="width:52px;color:var(--sub)">Slot ${i+1}</span>
      <span style="flex:1">${label}</span>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="uiSlotSave(${i})">Save current</button>
      <button class="btn btn-outline" style="padding:2px 10px" ${info && info.valid ? '' : 'disabled'} onclick="uiSlotActivate(${i})">Activate</button>
    </div>`;
  }
  const boxNow = document.getElementById('slotbox'); // render() may have replaced the node mid-run
  if (boxNow) boxNow.innerHTML = rows +
    `<div style="display:flex;gap:8px;align-items:center;margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line,#333)">
       <button class="btn btn-outline" style="padding:2px 10px" onclick="backupAllSlots()">Back up all slots</button>
       <button class="btn btn-outline" style="padding:2px 10px" onclick="document.getElementById('restoreFile').click()">Restore from file</button>
       <input id="restoreFile" type="file" accept="application/json,.json" style="display:none"
              onchange="if(this.files[0]){restoreAllSlots(this.files[0]); this.value='';}">
       <span id="backupStatus" style="flex:1;color:var(--sub);font-size:12px"></span>
     </div>`;
  _slotHealTries = 0; // full list rendered - reset the self-heal budget
}
async function refreshSlots(){
  // Single-flight: render() and explicit callers can both request a refresh;
  // overlapping runs interleave their HID queries and lose replies, so a
  // request during a run just schedules one more pass at the end.
  if (slotsBusy){ slotsRerun = true; return; }
  slotsBusy = true;
  try {
    do { slotsRerun = false; await _refreshSlotsOnce(); } while (slotsRerun);
  } finally { slotsBusy = false; }
}
async function uiSlotSave(i){
  try{
    if (!(await ensureDevice())){ toast('No device \u2014 click Connect', true); return; }
    const name = prompt(`Name for slot ${i+1} (max 16 chars):`, '');
    if (name === null) return;
    saving = true;
    const ok = await hidLocked(() => slotSave(i, name));
    toast(ok ? `Saved current settings to slot ${i+1}` : 'Slot save failed', !ok);
    await refreshSlots();
  } catch(e){ toast('Slot save failed: ' + e.message, true); }
  finally { saving = false; }
}
async function uiSlotActivate(i){
  try{
    if (!(await ensureDevice())){ toast('No device \u2014 click Connect', true); return; }
    saving = true;
    const res = await hidLocked(() => slotActivate(i));
    if (!res){ toast('Slot activate failed', true); return; }
    if (res.needsReenum){
      toast(`Slot ${i+1} active \u2014 device re-enumerating\u2026`);
      try { await sendCmd(0x03); } catch(_){}
      await sleep(2500);
      await reacquire();
    } else {
      toast(`Slot ${i+1} active`);
    }
    await readAll(); render(); await refreshSlots();
  } catch(e){ toast('Slot activate failed: ' + e.message, true); }
  finally { saving = false; }
}

// Query one field via cmd 0x04, then read 0x81 response.
// Wire (from 0x66 marker): [0x66, 0x04, field_id, value_bytes...]
async function readField(fieldId, type){
  // Retry a few times: verify the response's field_id matches what we asked for,
  // so a stale/buffered response from a previous query can't land in the wrong
  // field (this caused e.g. the noise gate showing 233 after the post-save
  // re-read, when one field's value was read into another's slot).
  for (let tryN = 0; tryN < 4; tryN++){
    await sendCmd(0x04, [fieldId]);
    await sleep(25);
    const data = await device.receiveFeatureReport(GET_REPORT);
    const raw = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
    let m = -1;
    for (let k = 0; k < Math.min(4, raw.length); k++){
      if (raw[k] === 0x66 && raw[k+1] === 0x04){ m = k; break; }
    }
    if (m < 0){ await sleep(15); continue; }
    const respField = raw[m + 2];
    if (respField !== fieldId){
      // Stale response for a different field — wait and retry.
      await sleep(15);
      continue;
    }
    const base = m + 3; // skip 0x66, 0x04, field_id -> value
    const dv = new DataView(raw.buffer, raw.byteOffset + base);
    if (type === 'u8')  return dv.getUint8(0);
    if (type === 'u16') return dv.getUint16(0, true);
    if (type === 'i16') return dv.getInt16(0, true);
    if (type === 'u32') return dv.getUint32(0, true);
    if (type === 'f32') return dv.getFloat32(0, true);
    return 0;
  }
  throw new Error('field 0x'+fieldId.toString(16)+' read mismatch after retries');
}

// Post-wake connect robustness: the fast bulk read can miss a packet while the
// BT link is still settling after a host wake. Retry it a few times with a short
// backoff before dropping to the slow per-field path.
const BULK_READ_TRIES = 3;
const BULK_READ_BACKOFF_MS = 150;
async function readAll(){
  const prev = {...config};
  // Bulk fast path (fw >= 1.4.0): whole config in a few packets. Retry a few
  // times before falling back — right after a host wake the link is settling and
  // the first attempt often returns null; a short-backoff retry usually lands it.
  if (bulkSupported !== false){
    let got = null;
    for (let attempt = 0; attempt < BULK_READ_TRIES; attempt++){
      try { got = await bulkReadFields(FIELDS); } catch(_){ got = null; }
      if (got) break;
      if (attempt < BULK_READ_TRIES - 1) await sleep(BULK_READ_BACKOFF_MS);
    }
    if (got){ bulkSupported = true; config = got; savedSnapshot = {...got};
              window._macroRows = null; return; }
    // Bulk still didn't complete. Do NOT latch bulkSupported=false here: a
    // wake-time link wobble makes bulk miss too, and disabling the fast path on a
    // transient miss pinned the whole session onto the slow per-field path (which
    // is why a close+reopen, once the link had settled, loaded faster). The real
    // decision is made after the per-field pass below, from link health.
  }
  const fresh = {};
  let failures = 0;
  for (const [fid,key,type] of FIELDS){
    try {
      fresh[key] = await readField(fid, type);
    } catch(e){
      // Keep the previous value rather than zeroing it — a transient read miss
      // (e.g. right after reconnect) shouldn't wipe the displayed config to 0.
      fresh[key] = (key in prev) ? prev[key] : 0;
      failures++;
    }
  }
  // If a lot of reads failed, the device was likely not ready yet — settle and
  // retry once so the refresh doesn't leave stale/zero values.
  if (failures > FIELDS.length / 3){
    await sleep(400);
    let ok = true;
    for (const [fid,key,type] of FIELDS){
      try { fresh[key] = await readField(fid, type); }
      catch(e){ ok = false; }
    }
    if (!ok) toast('Some values could not be read — try Re-read', true);
  }
  // Decide bulk support from link health: if the per-field pass read the whole
  // config cleanly (healthy link) yet bulk had failed, bulk is genuinely
  // unavailable (pre-1.4.0 firmware) -> stop probing it. If per-field ALSO
  // dropped reads, the link was the problem, not bulk -> leave bulkSupported
  // unset so the next (settled) connect re-probes the fast path.
  if (bulkSupported === null && failures === 0) bulkSupported = false;
  config = fresh;
  // The macro TABLE is device-global so it does not change with a profile, but a
  // reconnect gives us a new handle and the cached rows may predate it. Drop the
  // cache so the panel re-reads once, under the gate, rather than showing stale
  // rows next to a freshly-read enable mask.
  window._macroRows = null;
  // Both exit paths must refresh the baseline. The bulk path above already did;
  // this one did not, so after any read that fell back to per-field - which is
  // most likely right after a reconnect, when bulk tends to miss - savedSnapshot
  // still described the PREVIOUS device state. Two consequences: the macro panel
  // claimed unsaved changes that did not exist, and, more seriously, saveAll()'s
  // ENUM_FIELDS/kbdIfaceNeeded comparison used a stale baseline, so the next save
  // could trigger a reconnect that was not needed or skip one that was.
  savedSnapshot = {...fresh};
}

async function writeField(fieldId, type, value){
  let bytes;
  if (type === 'u8')  bytes = [value & 0xff];
  else if (type === 'u16'){ bytes = [value & 0xff, (value>>8)&0xff]; }
  else if (type === 'i16'){ const v = value | 0; bytes = [v & 0xff, (v>>8)&0xff]; }
  else if (type === 'u32'){ const v = value>>>0; bytes = [v & 0xff, (v>>>8)&0xff, (v>>>16)&0xff, (v>>>24)&0xff]; }
  else if (type === 'f32'){ const b=new Uint8Array(new Float32Array([value]).buffer); bytes=[...b]; }
  await sendCmd(0x01, [fieldId, ...bytes]);
}

// --- Bulk field transfer (fw >= 1.4.0) ---
// One profile apply used to be ~60 individual feature-report round-trips each
// way; bulk packs many fields per report (write cmd 0x0b, read cmd 0x0c), so an
// apply or full read is a handful of packets. Falls back to per-field silently
// on older firmware.
let bulkSupported = null; // null = unknown, probe on first use
function encField(type, value){
  if (type === 'u8')  return [value & 0xff];
  if (type === 'u16') return [value & 0xff, (value>>8)&0xff];
  if (type === 'i16'){ const v = value | 0; return [v & 0xff, (v>>8)&0xff]; }
  if (type === 'u32'){ const v = value>>>0; return [v & 0xff, (v>>>8)&0xff, (v>>>16)&0xff, (v>>>24)&0xff]; }
  return [...new Uint8Array(new Float32Array([value]).buffer)]; // f32
}
function decField(type, bytes){
  if (type === 'u8')  return bytes[0];
  if (type === 'u16') return bytes[0] | (bytes[1]<<8);
  if (type === 'i16') return (bytes[0] | (bytes[1]<<8)) << 16 >> 16;
  if (type === 'u32') return ((bytes[0] | (bytes[1]<<8) | (bytes[2]<<16) | (bytes[3]<<24)) >>> 0);
  return new Float32Array(new Uint8Array(bytes.slice(0,4)).buffer)[0];
}
async function bulkWriteFields(entries){ // entries: [{fid,type,value}] -> true if ALL applied
  const chunks = []; let cur = [], bytes = 1;
  for (const e of entries){
    const b = encField(e.type, e.value), sz = 2 + b.length;
    if (bytes + sz > 58){ chunks.push(cur); cur = []; bytes = 1; }
    cur.push({fid: e.fid, b}); bytes += sz;
  }
  if (cur.length) chunks.push(cur);
  for (const ch of chunks){
    const payload = [ch.length];
    for (const e of ch) payload.push(e.fid, e.b.length, ...e.b);
    await sendCmd(0x0b, payload);
    const r = await readCmdReply(0x0b, undefined, 12);
    if (!r || r[2] !== 0x00){ return false; }
  }
  return true;
}
async function bulkReadFields(fieldDefs){ // [[fid,key,type],...] -> {key:value} or null
  const out = {};
  for (let i = 0; i < fieldDefs.length; i += 12){
    const grp = fieldDefs.slice(i, i + 12);
    await sendCmd(0x0c, [grp.length, ...grp.map(f => f[0])]);
    const r = await readCmdReply(0x0c, undefined, 12);
    if (!r || r[2] !== 0x00) return null;
    let off = 4;
    const byFid = Object.fromEntries(grp.map(f => [f[0], f]));
    for (let n = 0; n < r[3]; n++){
      const fid = r[off], len = r[off+1];
      const f = byFid[fid];
      if (f) out[f[1]] = decField(f[2], Array.from(r.slice(off+2, off+2+len)));
      off += 2 + len;
    }
  }
  // every requested key must be present
  for (const f of fieldDefs) if (!(f[1] in out)) return null;
  return out;
}

// Read ONE field from a SLOT (fw >= 1.13.0, cmd 0x0d). Returns the decoded value
// or null. Used by backup, which reads every field of every slot without
// disturbing the active config.
async function slotReadField(slot, fdef){ // fdef = [fid,key,type]
  await sendCmd(0x0d, [slot, fdef[0]]);
  const r = await readCmdReplyOn(SLOT_REPORT, 0x0d, slot, 12); // slot field-read reply is on SLOT_REPORT (0x84)
  if (!r || r[2] !== 0x00) return null;
  // reply: 66 0d status slot fid <value bytes...>
  const sz = (fdef[2] === 'u16' || fdef[2] === 'i16') ? 2
           : ((fdef[2] === 'f32' || fdef[2] === 'u32') ? 4 : 1);
  return decField(fdef[2], Array.from(r.slice(5, 5 + sz)));
}

// ===== Trigger Effect Monitor + Custom Captured Effects (v1.18.12) =====
function effectTypeName(t){
  switch(t){
    case 0x00: return 'None';   case 0x05: return 'Off';
    case 0x01: case 0x21: return 'Resistance';
    case 0x02: case 0x22: return 'Bow / snap';
    case 0x06: case 0x26: return 'Vibration';
    case 0x23: case 0x25: return 'Weapon break';
    case 0x27: return 'Multi-pos vibration';
    default: return 'Type 0x' + t.toString(16).padStart(2,'0');
  }
}
function isVibrationType(t){ return t === 0x26 || t === 0x06 || t === 0x27; }
async function readEffectHistory(trig, slot){
  await sendCmd(0x0e, [trig, slot]);
  const r = await readCmdReplyOn(SLOT_REPORT, 0x0e, undefined, 12);
  if (!r || r[2] !== 0x00) return null;
  return Array.from(r.slice(5, 16));
}
async function readTriggerEffects(trig){
  const out = [];
  for (let s = 0; s < 6; s++){
    const eff = await readEffectHistory(trig, s);
    if (!eff) break;
    if (eff.every(b => b === 0)) continue;
    out.push(eff);
  }
  return out;
}
// last-refreshed effects, per trigger, so the checkboxes map to bytes
window._monEffects = { 0: [], 1: [] };
async function refreshEffectMonitor(){
  const box = document.getElementById('effmon');
  if (!box) return;
  try {
    let html = '';
    for (const [trig, label] of [[0,'R2 (right)'],[1,'L2 (left)']]){
      const effs = await hidLocked(() => readTriggerEffects(trig));
      window._monEffects[trig] = effs;
      html += `<div style="margin:8px 0"><b>${label}</b>`;
      if (!effs.length){ html += ` <span style="color:var(--sub)">— nothing captured yet (trigger the effect in-game, then Refresh)</span></div>`; continue; }
      html += `<div style="font-size:11px;color:var(--sub);margin:2px 0">Tick up to 5 states that make up one action. Mechanical states (walls, resistances) are placed by their trigger positions and played in sequence as you pull (e.g. wall → wall → end-resistance, or a resistance before a wall); vibration pairs blend at the rate slider.</div>`;
      effs.forEach((eff, i) => {
        const nm = effectTypeName(eff[0]);
        const hex = eff.map(b => b.toString(16).padStart(2,'0')).join(' ');
        html += `<div style="display:flex;gap:8px;align-items:center;margin:2px 0;font-size:12px">
          <input type="checkbox" id="mon_${trig}_${i}" onchange="onMonPick(${trig})">
          <span style="min-width:110px"><b>${nm}</b>${i===0?' (newest)':''}</span>
          <code style="color:var(--sub);font-size:11px">${hex}</code></div>`;
      });
      html += `<div style="margin-top:4px"><button class="btn btn-outline" style="padding:2px 10px" onclick="assignCustom(${trig})">Assign ticked → custom effect (${trig===0?'R2':'L2'})</button>
        <button class="btn btn-outline" style="padding:2px 10px" onclick="saveCustomFile(${trig})">Save ticked to file</button></div></div>`;
    }
    box.innerHTML = html;
  } catch(e){ box.innerHTML = 'Monitor error: ' + (e && e.message ? e.message : e); }
}
function getMonPicks(trig){
  const effs = window._monEffects[trig] || [];
  const picks = [];
  effs.forEach((eff,i) => { const c = document.getElementById(`mon_${trig}_${i}`); if (c && c.checked) picks.push(eff); });
  return picks;
}
function onMonPick(trig){
  const picks = getMonPicks(trig);
  if (picks.length > 5){ // cap at 5 (config stores 5 states)
    const effs = window._monEffects[trig] || [];
    let seen = 0;
    effs.forEach((eff,i)=>{ const c=document.getElementById(`mon_${trig}_${i}`); if(c&&c.checked){ seen++; if(seen>5) c.checked=false; } });
  }
}
// Write the ticked states into the live config as a custom effect on this trigger.
// A mechanical set only sequences if every state starts at a DIFFERENT trigger
// zone. Assign one that doesn't and the firmware silently falls back to rapid
// A/B cycling — which, with a weapon break in the set, is heard as constant
// clicking. Games routinely return to an earlier state (ready -> fired -> ready),
// so a timeline capture very often contains the same state twice; that repeat is
// not a third effect. Drop exact repeats automatically, and refuse anything still
// ambiguous rather than assigning something that will misbehave.
function ceValidateStates(list, getBytes){
  const isMech = b => [0x21,0x01,0x25,0x23,0x22,0x02].includes(b[0]);
  // Only MECHANICAL repeats are dropped. Their durations are discarded by the
  // firmware (position decides everything), so two byte-identical mechanical
  // states really are interchangeable and the first is kept. A VIBRATION set is
  // driven by TIME, so the same bytes held for a different length is a different
  // beat of the rhythm - deduplicating those would quietly destroy the pattern
  // the timeline recorder went to the trouble of capturing.
  const seen = [], kept = [], dropped = [];
  for (const item of list){
    const b = getBytes(item);
    if (isMech(b) && seen.some(x => x.every((v,i) => v === b[i]))) { dropped.push(b); continue; }
    if (isMech(b)) seen.push(b);
    kept.push(item);
  }
  const startZone = b => {
    const zb = b[1] | ((b[2] & 0x03) << 8);
    for (let z = 0; z < 10; z++) if (zb & (1 << z)) return z;
    return 0;
  };
  let clash = null;
  const mechKept = kept.map(getBytes).filter(isMech);
  if (mechKept.length > 1){
    const zs = mechKept.map(startZone);
    zs.forEach((z,i) => { if (clash === null && zs.indexOf(z) !== i) clash = z; });
  }
  return { kept, dropped, clash };
}

const CE_ZONE_CLASH_MSG = zone =>
  `Two of the ticked states begin at the same trigger position (zone ${zone}).\n\n` +
  `A multi-stage effect is ordered by where each stage starts, so every stage must ` +
  `start at a different position. Assigning these would fall back to rapid A/B ` +
  `cycling instead — with a weapon break in the set that is heard as constant clicking.\n\n` +
  `Untick one of them and assign again.`;

async function assignCustom(trig){
  let picks = getMonPicks(trig);
  if (!picks.length){ alert('Tick 1 or 2 states first.'); return; }
  {
    const v = ceValidateStates(picks, b => b);
    if (v.clash !== null){ alert(CE_ZONE_CLASH_MSG(v.clash)); return; }
    if (v.dropped.length) picks = v.kept;
  }
  try {
    await hidLocked(async () => {
      // write state A (and B if present) via cmd 0x11

async function tlSetArmed(on){

  return !!(r && r[2] === 0x00);

async function tlReadEntry(trig, idx){

// ===== Manual effect builder — author stages by hand, no capture needed =====
// Encoding mirrors the firmware's own writers exactly, so a hand-built stage is
// byte-identical to what the sliders (or a game) would emit for the same values.
window._cebStages = [];
function cebWire100(s){ const w = Math.floor((s * 7 + 50) / 100); return w > 7 ? 7 : (w < 0 ? 0 : w); }
function cebPackZones(b, zones, val3){
  let bits = 0;
  for (let z = 0; z <= 9; z++) if (zones & (1 << z)) bits |= (val3 & 7) << (3 * z);
  b[3] = bits & 0xFF; b[4] = (bits >>> 8) & 0xFF; b[5] = (bits >>> 16) & 0xFF; b[6] = (bits >>> 24) & 0xFF;
}
function cebBuildBytes(st){
  const b = new Array(11).fill(0);

  const e = Math.max(0, Math.min(9, st.end | 0));
  if (st.type === 'break'){
    let ws = Math.max(2, Math.min(7, s));
    let we = Math.min(8, Math.max(ws + 1, e));
    const zp = (1 << ws) | (1 << we);
    b[0] = 0x25; b[1] = zp & 0xFF; b[2] = (zp >>> 8) & 0xFF; b[3] = cebWire100(st.strength);
  } else if (st.type === 'bow'){
    // Bow/snap: zone pair in bytes 1-2, byte 3 packs draw strength and snap force
    // (both 1-8, sent as value-1). The snap presses the trigger BACK against the
    // finger at the end of the draw - the one thing resistance and weapon break
    // can't do. Same layout the firmware's own bow writer uses.
    let bs = Math.max(0, Math.min(7, s));
    let be = Math.min(8, Math.max(bs + 1, e));
    const zb = (1 << bs) | (1 << be);
    b[0] = 0x22; b[1] = zb & 0xFF; b[2] = (zb >>> 8) & 0xFF;
    b[3] = (cebWire100(st.strength) & 0x07) | ((cebWire100(st.snap) & 0x07) << 3);

    const lo = Math.min(s, e), hi = Math.max(s, e);
    let zones = 0;
    for (let z = lo; z <= hi; z++) zones |= (1 << z);
    b[0] = (st.type === 'vibration') ? 0x26 : 0x21;
    b[1] = zones & 0xFF; b[2] = (zones >>> 8) & 0x03;
    cebPackZones(b, zones, cebWire100(st.strength));

}

    const hex = st.bytes.map(b => b.toString(16).padStart(2, '0')).join(' ');

// NOTE: no ceValidateStates() call here by design — cebAddStage() already refuses

// captured data and do need the guard.
async function cebAssign(trig){
  const list = window._cebStages;
  if (!list.length){ alert('Add at least one stage first.'); return; }
  const sorted = list.slice().sort((a, b) => cebStartZone(a.bytes) - cebStartZone(b.bytes));
  const base = trig === 0 ? 0x57 : 0x5c;   // used by the writes AND the read-back below

    await hidLocked(async () => {
      for (let i = 0; i < sorted.length; i++){

      // ignored by the firmware (the bug that made every Assign unreliable).
      await sendCmd(0x01, [base + 0, 1]);              // enable

      await sendCmd(0x01, [base + 2, 0]);              // zone 0 = reset on full release
      await sendCmd(0x01, [base + 4, sorted.length]);  // state count
    });

    const vEnable = await hidLocked(() => readField(base + 0, 'u8'));
    const vCount  = await hidLocked(() => readField(base + 4, 'u8'));
    if (vEnable !== 1 || vCount !== sorted.length){
      alert(`VERIFY FAILED — device reports enable=${vEnable}, state count=${vCount} (expected 1 and ${sorted.length}). The effect will not play correctly; try Assign again.`);

    config[pfx + '_enable'] = 1;
    config[pfx + '_condition'] = 0;
    config[pfx + '_thresh'] = 0;
    config[pfx + '_state_count'] = sorted.length;
    (window._dirty = window._dirty || {})[pfx + '_enable'] = 1;
    window._dirty[pfx + '_state_count'] = 1;

    alert(`Built ${sorted.length}-stage effect assigned to ${trig === 0 ? 'R2' : 'L2'} (condition While held, zone 0 set for you). Save to a slot to keep it.`);

}
async function ceClearDevice(trig){

  const base = trig === 0 ? 0x57 : 0x5c;

  // hand-off). That is a profile preference about how the trigger is shared, not
  // part of the effect payload - resetting it meant re-picking it every time an
  // effect was swapped.
  try {
    await hidLocked(async () => {
      const zeros = new Array(11).fill(0);
      for (let i = 0; i < 5; i++){                       // wipe all stored states

        await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
      }

      await sendCmd(0x01, [base + 4, 0]);                // state count 0

    const vCount  = await hidLocked(() => readField(base + 4, 'u8'));

      alert(`VERIFY FAILED — device still reports enable=${vEnable}, state count=${vCount}. Try again.`);
      return;
    }

    const pfx = trig === 0 ? 'ce_r2' : 'ce_l2';
    config[pfx + '_enable'] = 0;
    config[pfx + '_state_count'] = 0;
    (window._dirty = window._dirty || {})[pfx + '_enable'] = 1;
    window._dirty[pfx + '_state_count'] = 1;

// ---- Reader: decode whatever is actually on a trigger -------------------------
// Raw effect bytes are unreadable, and until now there was nowhere to see what a
// captured or loaded effect actually IS. This decodes each stored state the same
// way the builder describes one, and adds the ACTIVE POSITION WINDOW the firmware
// will give it - which is the part you cannot work out by eye, and the thing that
// explains a wall that never breaks or a stage that never fires.
const CE_TYPE_NAMES = {0x21:'Resistance',0x01:'Resistance',0x25:'Weapon break',0x23:'Weapon break',

function ceZonesOfBytes(b){
  const zb = b[1] | ((b[2] & 0x03) << 8);
  const out = []; for (let z = 0; z < 10; z++) if (zb & (1 << z)) out.push(z);
  return out;
}
function ceZoneForce(b, z){            // inverse of cebPackZones
  const bits = b[3] | (b[4] << 8) | (b[5] << 16) | (b[6] << 24);

// Force is a 3-bit level, 0-7, written straight through with no offset — the
// firmware derives it as (strength% * 7 + 50) / 100 and refuses to engage a
// slider effect at all when the strength is 0. So 0 is the WEAKEST level, not a
// "use the hardware default" sentinel. Report the level rather than interpreting
// it, and flag 0 since an effect at level 0 may be imperceptible.
function ceForceLabel(b, z){
